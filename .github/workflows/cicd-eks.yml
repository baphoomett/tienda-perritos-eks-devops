name: CI/CD Tienda Perritos EKS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy-eks:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código del repositorio
      uses: actions/checkout@v3

    - name: 2. Configurar credenciales de AWS Academy
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: 3. Iniciar sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 4. Crear repositorios ECR si no existen
      env:
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        for repo in tienda-backend tienda-frontend tienda-db; do
          aws ecr describe-repositories --repository-names "$repo" --region $AWS_REGION 2>/dev/null || \
          aws ecr create-repository --repository-name "$repo" --region $AWS_REGION
        done

    - name: 5. Construir, etiquetar y subir imágenes a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        echo "Construyendo y subiendo Backend..."
        docker build -t $ECR_REGISTRY/tienda-backend:$IMAGE_TAG ./backend
        docker push $ECR_REGISTRY/tienda-backend:$IMAGE_TAG

        echo "Construyendo y subiendo Frontend..."
        docker build -t $ECR_REGISTRY/tienda-frontend:$IMAGE_TAG ./frontend
        docker push $ECR_REGISTRY/tienda-frontend:$IMAGE_TAG

        echo "Construyendo y subiendo Base de Datos..."
        docker build -t $ECR_REGISTRY/tienda-db:$IMAGE_TAG ./db
        docker push $ECR_REGISTRY/tienda-db:$IMAGE_TAG

    - name: 6. Conectar GitHub Actions al Clúster EKS
      run: |
        aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name nombre-eks

    - name: 7. Desplegar manifiestos en Kubernetes
      run: |
        cd k8s
        kubectl apply -f . -n tienda

    - name: 8. Forzar actualización de los Pods
      run: |
        kubectl rollout restart deployment tienda-backend -n tienda
        kubectl rollout restart deployment tienda-frontend -n tienda